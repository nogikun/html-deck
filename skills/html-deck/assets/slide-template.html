  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <link rel="stylesheet" href="../theme.css">
  <style>
    /* このスライド固有のレイアウトだけをここに書く。

  </style>
</head>

    <header class="slide-header">
      <div class="eyebrow">__SECTION__</div>

      <!-- 1枚 = 1主張。見出しだけ読んで結論が分かる状態にする -->
      <h2>__CLAIM__</h2>
    </main>

    <footer class="slide-footer">
      <div class="source">__SOURCE__</div>
