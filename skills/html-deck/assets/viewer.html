<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; frame-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>__DECK_TITLE__</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      --shell: #091321; --line: #25364d; --text: #dce6f4; --muted: #7f91a9; --accent: #4f80ff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--shell); color: var(--text); }
    body { display: grid; grid-template-rows: 48px 1fr 58px; min-width: 0; }
    .topbar, .controls { display: flex; align-items: center; width: 100%; min-width: 0; padding: 0 24px; }
    .topbar { justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand, .counter { font: 700 12px/1 "SFMono-Regular", monospace; letter-spacing: .12em; text-transform: uppercase; }
    .brand { color: #9eb6d5; }
    .counter { color: var(--muted); }
    .stage { width: 100%; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
    .frame {
      position: absolute; left: 50%; top: 50%;
      width: 1600px; height: 900px;
      transform: translate(-50%, -50%) scale(var(--deck-scale, 1));
      transform-origin: center;
      background: #fff;
      box-shadow: 0 28px 80px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.08);
    }
    iframe { width: 1600px; height: 900px; border: 0; display: block; background: #fff; }
    .scale-note {
      position: absolute; right: 14px; bottom: 12px; z-index: 2; opacity: 0; pointer-events: none;
      padding: 8px 11px; border: 1px solid #7b5c22; border-radius: 4px;
      background: rgba(29,22,10,.92); color: #ffd37d;
      font: 700 11px/1.35 "SFMono-Regular", monospace; transition: opacity .18s ease;
    }
    .scale-note[data-visible="true"] { opacity: 1; }
    .controls { gap: 14px; border-top: 1px solid var(--line); }
    button {
      width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%;
      background: #101e30; color: var(--text); cursor: pointer; font-size: 16px;
    }
    button:hover { border-color: #5275a4; background: #172a42; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .3; cursor: default; }
    .title { flex: 1; min-width: 0; font-size: 13px; color: #bac8db; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress { width: min(32vw, 420px); height: 3px; background: #1c2b3e; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
    .hint { font: 11px/1 "SFMono-Regular", monospace; color: var(--muted); }
    @media (max-width: 720px) { .hint, .progress { display: none; } .topbar, .controls { padding-inline: 12px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">__DECK_TITLE__</div>
    <div class="counter" id="counter" aria-live="polite">01 / 01</div>
  </header>
  <main class="stage">
    <!-- sandbox に allow-same-origin が要る。値なしの sandbox は iframe を
         不透明オリジンにするため、スライド側 CSP の 'self' が何にも一致せず、
         共有の theme.css ごと全て遮断されて素のHTMLが表示される。
         allow-scripts は付けないので、スクリプト遮断という本来の目的は保たれる。 -->
    <div class="frame"><iframe id="slide" title="プレゼンテーションスライド" sandbox="allow-same-origin"></iframe></div>
    <div class="scale-note" id="scaleNote" role="status">表示が小さいため、全画面表示を推奨します</div>
  </main>
  <footer class="controls">
    <button id="prev" type="button" aria-label="前のスライド">←</button>
    <button id="next" type="button" aria-label="次のスライド">→</button>
    <div class="title" id="title" aria-live="polite"></div>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <div class="hint">← → / SPACE</div>
    <button id="fullscreen" type="button" aria-label="全画面表示">⛶</button>
  </footer>
  <script>
    // このブロックは check_deck.py が slides/*.html の <title> から自動再生成する。
    // 手で書き換えても次回の検査で上書きされる。順序はファイル名順。
    // <slides>
    const slides = [
    ];
    // </slides>

    const frame = document.getElementById("slide");
    const frameShell = document.querySelector(".frame");
    const stage = document.querySelector(".stage");
    const counter = document.getElementById("counter");
    const title = document.getElementById("title");
    const progress = document.getElementById("progress");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const scaleNote = document.getElementById("scaleNote");
    let index = Math.min(Math.max((Number(location.hash.slice(1)) || 1) - 1, 0), Math.max(slides.length - 1, 0));

    function fitDeck() {
      const width = Math.max(stage.clientWidth - 56, 160);
      const height = Math.max(stage.clientHeight - 36, 90);
      const scale = Math.min(width / 1600, height / 900);
      frameShell.style.setProperty("--deck-scale", String(scale));
      scaleNote.dataset.visible = String(scale < 0.45);
    }

    function render(updateHash = true) {
      if (!slides.length) return;
      frame.src = slides[index][0];
      frame.title = `スライド ${index + 1}: ${slides[index][1]}`;
      counter.textContent = `${String(index + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}`;
      title.textContent = slides[index][1];
      progress.style.width = `${((index + 1) / slides.length) * 100}%`;
      prev.disabled = index === 0;
      next.disabled = index === slides.length - 1;
      if (updateHash) history.replaceState(null, "", `#${index + 1}`);
    }
    function go(delta) {
      const n = Math.min(Math.max(index + delta, 0), slides.length - 1);
      if (n !== index) { index = n; render(); }
    }
    prev.addEventListener("click", () => go(-1));
    next.addEventListener("click", () => go(1));
    document.getElementById("fullscreen").addEventListener("click", async () => {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    });
    window.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) { event.preventDefault(); go(1); }
      if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === "Home") { index = 0; render(); }
      if (event.key === "End") { index = slides.length - 1; render(); }
    });
    window.addEventListener("hashchange", () => {
      const requested = Number(location.hash.slice(1));
      if (requested >= 1 && requested <= slides.length) { index = requested - 1; render(false); }
    });
    new ResizeObserver(fitDeck).observe(stage);
    window.addEventListener("resize", fitDeck);
    document.addEventListener("fullscreenchange", fitDeck);
    fitDeck();
    render(false);
  </script>
</body>
</html>
